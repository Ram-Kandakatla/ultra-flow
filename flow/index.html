<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Flow Grid</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flow">
<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'IBM Plex Sans';font-weight:100 700;font-display:swap;src:url(fonts/ibm-plex-sans.woff2) format('woff2')} /* variable, latin only */
@font-face{font-family:'Space Grotesk';font-weight:300 700;font-display:swap;src:url(fonts/space-grotesk.woff2) format('woff2')}
/* Theme borrowed from GPA-calc: warm paper / toasted dark neutrals, Space Grotesk display + IBM Plex Sans body, 8/14px radii.
   Palette: paper --bg, ink --tx, muted ink --txm, accent --orange (logo, points, board glow), interactive --blue. Glow shadow only on the board.
   Layout: home screen (shape + level) overlays the game. Game: phone = one column; wide screens = board left, controls in a side column.
   Pipe colors --p0..--p18 are per theme, each >=4.3:1 against the board (checked), dots also carry letters so color is never the only cue. */
:root{
  --bg:#f7f4ef;--surface:#fffdfa;--s2:#ece7df;--s3:#e2ddd3;--border:rgba(60,40,20,.08);--bmed:rgba(60,40,20,.14);
  --tx:#1c1c1a;--txm:#6a6a66;--green:#2a7a3b;--blue:#1a60b0;--bbg:#ddeaf9;--orange:#c05c00;--glow:rgba(255,158,68,.22);--amb:rgba(255,158,68,.3);
  --p0:#c62828;--p1:#1a60b0;--p2:#2a7a3b;--p3:#9a7300;--p4:#c05c00;--p5:#00838f;--p6:#b0247a;--p7:#6b46c1;--p8:#557a00;--p9:#8a5a34;--p10:#d6336c;--p11:#4b5563;--p12:#2b2722;--p13:#1818dc;--p14:#c918d5;--p15:#721830;--p16:#552267;--p17:#971197;--p18:#7c240e;
  --r:8px;--rl:14px;--col:600px;
  --fs-xs:11px;--fs-sm:13px;--fs-base:15px;--fs-md:17px;--fs-lg:20px;--fs-num:22px; /* type scale: labels, UI, body, dialog title, brand, stat numbers */
  --t-fast:120ms;--t-med:320ms;--ease-out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.6,.5,1); /* motion tokens */
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-display:'Space Grotesk',var(--font-body);
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1714;--surface:#242019;--s2:#2d2822;--s3:#37312a;--border:rgba(255,235,215,.08);--bmed:rgba(255,235,215,.14);
  --tx:#f0efe9;--txm:#9a9a94;--green:#4ec668;--blue:#5fa8f5;--bbg:#0d2238;--orange:#f5a742;--glow:rgba(255,140,60,.22);--amb:rgba(255,140,60,.18);
  --p0:#ff6b6b;--p1:#5fa8f5;--p2:#4ec668;--p3:#f5d142;--p4:#f5a742;--p5:#3fd0e0;--p6:#f062c0;--p7:#a98bff;--p8:#b5dc5a;--p9:#c9935f;--p10:#ffadc6;--p11:#9aa3ad;--p12:#f4f1ea;--p13:#3eea3e;--p14:#d445ea;--p15:#9addb1;--p16:#f4e89a;--p17:#c2a0df;--p18:#dc5a86;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1714;--surface:#242019;--s2:#2d2822;--s3:#37312a;--border:rgba(255,235,215,.08);--bmed:rgba(255,235,215,.14);
  --tx:#f0efe9;--txm:#9a9a94;--green:#4ec668;--blue:#5fa8f5;--bbg:#0d2238;--orange:#f5a742;--glow:rgba(255,140,60,.22);--amb:rgba(255,140,60,.18);
  --p0:#ff6b6b;--p1:#5fa8f5;--p2:#4ec668;--p3:#f5d142;--p4:#f5a742;--p5:#3fd0e0;--p6:#f062c0;--p7:#a98bff;--p8:#b5dc5a;--p9:#c9935f;--p10:#ffadc6;--p11:#9aa3ad;--p12:#f4f1ea;--p13:#3eea3e;--p14:#d445ea;--p15:#9addb1;--p16:#f4e89a;--p17:#c2a0df;--p18:#dc5a86;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs-base)/1.55 var(--font-body);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-block:8px 12px;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .2s,color .2s}
@media (prefers-reduced-motion:reduce){*,::backdrop{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
#game{display:contents} /* wrapper only for inert while home is up; its children stay in body's layout */
header,.card,#wrap,.bar,footer{width:100%;max-width:var(--col)} /* one shared column edge, board included */
header,.bar{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;margin:0 auto 0 0;font:700 var(--fs-lg)/1.15 var(--font-display);letter-spacing:-.4px}
.brand svg{color:var(--orange);flex-shrink:0}
.card{background:var(--surface);border:.5px solid var(--bmed);border-radius:var(--rl);transition:background .2s}
#hud{align-items:center;flex-wrap:wrap;row-gap:10px;padding:10px 14px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:grid;gap:2px}
.stats b{font-size:var(--fs-xs);font-weight:500;color:var(--txm);text-transform:uppercase;letter-spacing:.04em}
.stats span{font:700 var(--fs-num)/1 var(--font-display);letter-spacing:-.5px;transform-origin:left center}
.bump{animation:bump var(--t-med) var(--spring)}
@keyframes bump{40%{transform:scale(1.2)}}
#pts,#de{color:var(--orange)} /* reward color; 22px bold is large text, so 3:1 is the bar */
#hintBtn{margin-left:auto}
#wrap{flex:1;min-height:0;max-height:100vw;width:100%;display:grid;place-items:center} /* no overflow clip: the win pop grows past it.
  max-height: on tall phones the whole column centers instead of the board floating in a stretched gap */
canvas{touch-action:none;border-radius:var(--rl);filter:drop-shadow(0 10px 12px var(--glow)) drop-shadow(0 0 36px var(--amb))} /* lift + ambient halo, both follow the board's shape */
.pop{animation:pop 420ms var(--spring)} /* keep in sync with MS.lift */
@keyframes pop{45%{transform:scale(var(--pop,1.2));filter:drop-shadow(0 22px 22px var(--glow)) drop-shadow(0 0 36px var(--amb))}} /* --pop set per layout in resize() */
#st{flex:1;min-width:0;font-size:var(--fs-sm);line-height:1.35;color:var(--txm);font-variant-numeric:tabular-nums;transition:color var(--t-med)}
#st.win{color:var(--green);font-weight:600}
footer{font-size:var(--fs-sm);color:var(--txm);font-variant-numeric:tabular-nums}
.btn{min-height:44px;padding:0 16px;font:500 var(--fs-sm) var(--font-body);border-radius:var(--r);cursor:pointer;border:.5px solid var(--bmed); /* 44px tap target at every width */
  background:var(--s2);color:var(--tx);white-space:nowrap;transition:background var(--t-fast),opacity var(--t-fast),transform var(--t-fast) var(--ease-out)}
.btn:hover{background:var(--s3)}
.btn:active,.level:active,.shape:active{transform:scale(.96)}
.btn-primary,.btn-primary:hover{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn-primary:hover{opacity:.82}
.btn-ghost{background:none;border-color:transparent;color:var(--txm)}
.btn-ghost:hover{background:var(--s2);color:var(--tx)}
.btn-sample{background:var(--bbg);color:var(--blue);border-color:var(--blue);font-weight:600}
.btn-sample:hover{background:var(--blue);color:var(--surface)}
.theme-toggle{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;background:none;border:0;color:var(--txm);font:var(--fs-sm) var(--font-body);cursor:pointer}
.toggle-track{width:30px;height:17px;background:var(--s3);border-radius:9px;position:relative;transition:background .2s}
.toggle-thumb{position:absolute;top:2px;left:2px;width:13px;height:13px;background:var(--txm);border-radius:50%;transition:transform .2s,background .2s}
.theme-toggle[aria-checked="true"] .toggle-track{background:var(--blue)}
.theme-toggle[aria-checked="true"] .toggle-thumb{transform:translateX(13px);background:#fff}
dialog{margin:auto;width:min(360px,calc(100% - 32px));border:.5px solid var(--bmed);border-radius:var(--rl);background:var(--surface);color:var(--tx);
  padding:1.5rem 1.5rem 1.25rem;box-shadow:0 24px 48px -24px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,14,8,.45)}
dialog[open]{animation:rise var(--t-med) var(--ease-out)}           /* popup rises in; closing stays instant (exit faster than enter) */
dialog[open]::backdrop{animation:fade .32s cubic-bezier(.2,.8,.2,1)} /* literal: ::backdrop can't read custom properties in older Safari */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes fade{from{opacity:0}}
form{display:grid;gap:14px}
h2{font:600 var(--fs-md)/1.15 var(--font-display);letter-spacing:-.2px;margin:0}
.rec-line{margin:0;font-size:var(--fs-sm);color:var(--txm)}
.rec-line.new{color:var(--green);font-weight:600}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* Home: pick a shape, then tap a level to start. Shapes are drawn from the same masks the generator uses. */
.home{position:fixed;inset:0;z-index:5;overflow-y:auto;touch-action:pan-y;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:20px;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.home>*{width:100%;max-width:880px}
.home-body{display:grid;gap:24px}
.eyebrow{font:600 var(--fs-xs)/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--txm);margin:0 0 10px}
.shapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shape{display:grid;justify-items:center;gap:8px;padding:12px 6px 10px;background:var(--surface);border:.5px solid var(--bmed);border-radius:var(--rl);
  color:var(--txm);font:500 var(--fs-sm) var(--font-body);cursor:pointer;transition:transform var(--t-fast) var(--ease-out),color var(--t-fast)}
.shape svg{width:100%;max-width:60px;aspect-ratio:1;fill:var(--s3);transition:fill var(--t-med)}
.shape[aria-pressed="true"]{color:var(--tx);border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}
.shape[aria-pressed="true"] svg{fill:var(--orange)}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.level{width:100%;min-height:60px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:10px 16px;text-align:left;
  background:var(--surface);border:.5px solid var(--bmed);border-radius:var(--rl);color:var(--tx);font:inherit;cursor:pointer;transition:background var(--t-fast),transform var(--t-fast) var(--ease-out)}
.level:hover{background:var(--s2)}
.level b{font:700 var(--fs-lg)/1 var(--font-display);letter-spacing:-.3px}
.level .sz,.level .rec{font-size:var(--fs-sm);color:var(--txm);font-variant-numeric:tabular-nums}
.level .rec{text-align:right;line-height:1.35}
.flows{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}.flows i{width:6px;height:6px;border-radius:50%} /* the exact colors this level's board uses */
.pts-line{margin:12px 0 0;font-size:var(--fs-sm);color:var(--txm)}
@media (min-width:760px){
  .home{padding-block:calc(env(safe-area-inset-top,0px) + 24px) 40px;gap:32px}
  .home-body{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:start}
  .shapes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .shape{padding:20px 12px 16px}.shape svg{max-width:112px}
}
/* Wide screens (tablet/phone landscape, desktop): the board takes the left, controls stack in a side column.
   Board and brand share a top edge at every size. */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  body{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);grid-template-rows:auto auto auto auto 1fr;
    column-gap:clamp(24px,4vw,56px);align-items:start;padding-inline:clamp(16px,4vw,48px);padding-block:clamp(12px,4vh,40px)}
  #wrap{grid-column:1;grid-row:1/-1;height:100%;max-width:none;max-height:none;place-items:start center}
  header,.card,.bar,footer{grid-column:2;max-width:none}
}
</style>
<section id="home" class="home" aria-label="Choose a board">
  <header>
    <h1 class="brand"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v7a5 5 0 0 0 5 5h7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="6" cy="6" r="4" fill="currentColor"/><circle cx="18" cy="18" r="4" fill="currentColor"/></svg>Flow</h1>
    <button class="theme-toggle" role="switch" aria-checked="false">Dark mode<span class="toggle-track"><span class="toggle-thumb"></span></span></button>
  </header>
  <div class="home-body">
    <div><h2 class="eyebrow">Shape</h2><div class="shapes" id="shapes"></div></div>
    <div><h2 class="eyebrow">Level</h2><ul class="levels" id="levels"></ul><p class="pts-line" id="ptsLine"></p></div>
  </div>
</section>
<div id="game">
  <header>
    <h1 class="brand"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v7a5 5 0 0 0 5 5h7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="6" cy="6" r="4" fill="currentColor"/><circle cx="18" cy="18" r="4" fill="currentColor"/></svg>Flow</h1>
    <button class="theme-toggle" role="switch" aria-checked="false">Dark mode<span class="toggle-track"><span class="toggle-thumb"></span></span></button>
  </header>
  <section id="hud" class="card stats" aria-label="Game stats"><div><b>Time</b><span id="tm"></span></div><div><b>Score</b><span id="sc"></span></div><div><b>Points</b><span id="pts"></span></div><button class="btn btn-sample" id="hintBtn">Hint −10</button></section>
  <main id="wrap"><canvas id="cv" aria-label="Flow puzzle board"></canvas></main>
  <div class="bar"><span id="st" aria-live="polite"></span><button class="btn btn-ghost" id="solBtn">Solution</button><button class="btn btn-primary" id="doneBtn">Done</button></div>
  <footer id="best"></footer>
</div>
<dialog id="dlg"><form method="dialog">
  <h2 id="dh"></h2>
  <div class="stats" id="dsum"><div><b>Time</b><span id="dt"></span></div><div><b>Score</b><span id="ds"></span></div><div><b>Points</b><span id="de"></span></div></div>
  <p class="rec-line" id="rec"></p>
  <div class="row"><button class="btn btn-ghost" id="keepBtn" value=""></button><button class="btn" value="home">Home</button><button class="btn btn-primary" id="goBtn" value="go" autofocus></button></div>
</form></dialog>
<script src="app.js"></script>
