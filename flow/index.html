  </nav>
  <div class="tab" id="tab-play">
    <p class="lead">Join each pair of dots. Fill every square.</p>
    <div class="home-body">
      <div><h2 class="eyebrow">1 · Choose a shape</h2><div class="shapes" id="shapes"></div></div>
      <div><h2 class="eyebrow">2 · Pick a level</h2><ul class="levels" id="levels"></ul><p class="pts-line" id="ptsLine"></p></div>
    </div>
  </div>
  <div class="tab" id="tab-profile" hidden>
    <section class="card profile" aria-label="Your profile">
      <div class="prof-head"><span class="avatar" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0z"/></svg></span>
        <div class="stats prof-stats"><div><b>Points</b><span id="profPts"></span></div><div><b id="profBestHead"></b><span id="profBest"></span></div></div>
        <button class="btn btn-primary icon-btn" id="toShop" aria-label="Open the shop" title="Shop"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></button></div>
      <nav class="tabs" id="profLevels" aria-label="Difficulty"></nav>
      <div><h2 class="eyebrow" id="bestsHead"></h2><ul class="bests" id="bests"></ul></div>
      <p class="prof-sub" id="profTotal"></p>
    </section>
  </div>
  <div class="tab shop" id="tab-shop" hidden></div>
</section>

  <section id="hud" class="card stats" aria-label="Game stats"><div><b>Time</b><span id="tm"></span></div><div><b>Score</b><span id="sc"></span></div><div><b>Points</b><span id="pts"></span><small id="ptsGain"></small></div><div><b id="recHead">Record</b><span id="rec"></span></div><button class="btn btn-sample" id="hintBtn">Hint −10</button></section>
  <main id="wrap"><canvas id="cv" aria-label="Flow puzzle board"></canvas></main>
  <div class="bar"><span id="st" aria-live="polite"></span><button class="btn btn-ghost" id="solBtn">Solution</button><button class="btn btn-quiet" id="doneBtn">Done</button></div>
  <div class="bar" id="demoBar"><span id="demoSt" aria-live="polite"></span><button class="btn btn-ghost" id="againBtn">Again</button><button class="btn btn-primary" id="backBtn">← Back to shop</button></div>

</div>
<dialog id="dlg"><form method="dialog">
  <h2 id="dh"></h2>
  <div class="row"><button class="btn" id="keepBtn" value=""></button><button class="btn" value="home">Change level</button><button class="btn" value="home">Home</button><button class="btn btn-primary" value="go" autofocus>New puzzle</button></div>
</form></dialog>
<dialog id="setDlg"><form method="dialog" id="setForm">
  <h2>Settings</h2>
  <p class="rec-line" id="skyHint">Equip Time of day in the Shop to change the sky.</p>
  <fieldset class="skies" id="skyPick"><legend class="eyebrow">Sky</legend>
    <label><input type="radio" name="sky" value="auto"><i id="autoSw"></i>Auto<small>Follows the clock</small></label>
    <label><input type="radio" name="sky" value="sunrise"><i class="sunrise"></i>Sunrise<small>5–8 AM</small></label>
    <label><input type="radio" name="sky" value="daytime"><i class="daytime"></i>Daytime<small>8 AM–5 PM</small></label>
    <label><input type="radio" name="sky" value="sunset"><i class="sunset"></i>Sunset<small>5–8 PM</small></label>
    <label><input type="radio" name="sky" value="nighttime"><i class="nighttime"></i>Night<small>8 PM–5 AM</small></label>
  </fieldset>
  <label class="opt"><input type="checkbox" id="letters">Color-blind mode<small>Letters on the dots, so colors aren't the only way to tell pipes apart</small></label>
  <div class="row"><button class="btn btn-primary">Done</button></div>
</form></dialog>
